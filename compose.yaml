name: sop-vision

networks:
  default:
    name: sop-vision
    driver: bridge

volumes:
  postgres-data:

services:

  postgres:
    image: postgres:${POSTGRES_IMAGE_TAG:-17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-sop_vision}"
      POSTGRES_USER: "${POSTGRES_USER:-sop_vision}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-sop_vision_dev_password}"
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mediamtx:
    image: bluenviron/mediamtx:${MEDIAMTX_IMAGE_TAG:-1}
    restart: unless-stopped
    environment:
      MTX_API: "${MTX_API:-yes}"
      MTX_APIADDRESS: "${MTX_APIADDRESS:-:9997}"
      MTX_WEBRTC: "${MTX_WEBRTC:-yes}"
      MTX_WEBRTCADDRESS: "${MTX_WEBRTCADDRESS:-:8889}"
      MTX_WEBRTCLOCALUDPADDRESS: "${MTX_WEBRTCLOCALUDPADDRESS:-:8189}"
      MTX_WEBRTCADDITIONALHOSTS: "${MTX_WEBRTCADDITIONALHOSTS:-127.0.0.1}"
    ports:
      - "${MEDIAMTX_RTSP_PORT:-8554}:8554"
      - "${MEDIAMTX_WEBRTC_PORT:-8889}:8889"
      - "${MEDIAMTX_WEBRTC_UDP_PORT:-8189}:8189/udp"
    expose:
      - "9997"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgresql://sop_vision:sop_vision_dev_password@postgres:5432/sop_vision}"
      MEDIAMTX_API_URL: "${MEDIAMTX_API_URL:-http://mediamtx:9997}"
      MEDIAMTX_API_TIMEOUT: "${MEDIAMTX_API_TIMEOUT:-5}"
      PUBLIC_WEBRTC_BASE_URL: "${PUBLIC_WEBRTC_BASE_URL:-http://localhost:8889}"
      BACKEND_CORS_ORIGINS: "${BACKEND_CORS_ORIGINS:-http://localhost:8000}"
      UVICORN_LOG_LEVEL: "${BACKEND_LOG_LEVEL:-info}"
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    depends_on:
      mediamtx:
        condition: service_started
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:3001/api/v1/health/live', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
