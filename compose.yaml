name: sop-vision

volumes:
  postgres-data:
  redis-data:

services:

  postgres:
    image: postgres:${POSTGRES_IMAGE_TAG:-17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-sop_vision}"
      POSTGRES_USER: "${POSTGRES_USER:-sop_vision}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-sop_vision}"
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      default:
        aliases:
          - sop-vision-postgres

  redis:
    image: redis:${REDIS_IMAGE_TAG:-7-alpine}
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - redis-data:/data
    expose:
      - "6379"
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      default:
        aliases:
          - sop-vision-redis

  mediamtx:
    image: bluenviron/mediamtx:${MEDIAMTX_IMAGE_TAG:-1.20.1}
    restart: unless-stopped
    environment:
      MTX_API: "${MTX_API:-yes}"
      MTX_APIADDRESS: ":9997"
      # v1.20.1 默认只允许容器内 localhost 调用 API；这里允许现有 Compose 私有网络中的 Backend。
      # 基础 Compose 不发布 9997，浏览器仍无法直接访问 Control API。
      MTX_AUTHINTERNALUSERS_1_IPS: "0.0.0.0/0"
      MTX_WEBRTC: "${MTX_WEBRTC:-yes}"
      MTX_WEBRTCADDRESS: ":8889"
      MTX_WEBRTCLOCALUDPADDRESS: ":8189"
      MTX_WEBRTCADDITIONALHOSTS: "${MTX_WEBRTCADDITIONALHOSTS:-127.0.0.1}"
    ports:
      - "${MEDIAMTX_RTSP_PORT:-8554}:8554"
      - "${MEDIAMTX_WEBRTC_PORT:-8889}:8889"
      - "${MEDIAMTX_WEBRTC_UDP_PORT:-8189}:8189/udp"
    expose:
      - "9997"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgresql+psycopg://sop_vision:sop_vision@postgres:5432/sop_vision}"
      DATABASE_POOL_SIZE: "${DATABASE_POOL_SIZE:-5}"
      DATABASE_MAX_OVERFLOW: "${DATABASE_MAX_OVERFLOW:-5}"
      DATABASE_POOL_TIMEOUT: "${DATABASE_POOL_TIMEOUT:-30}"
      DATABASE_POOL_RECYCLE: "${DATABASE_POOL_RECYCLE:-1800}"
      DATABASE_CONNECT_TIMEOUT: "${DATABASE_CONNECT_TIMEOUT:-10}"
      DATABASE_ECHO: "${DATABASE_ECHO:-false}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
      MEDIAMTX_API_URL: "${MEDIAMTX_API_URL:-http://mediamtx:9997}"
      MEDIAMTX_API_TIMEOUT: "${MEDIAMTX_API_TIMEOUT:-5}"
      MEDIA_RECONCILIATION_INTERVAL_SECONDS: "${MEDIA_RECONCILIATION_INTERVAL_SECONDS:-30}"
      MEDIA_RECONCILIATION_MAX_BACKOFF_SECONDS: "${MEDIA_RECONCILIATION_MAX_BACKOFF_SECONDS:-300}"
      PUBLIC_WEBRTC_BASE_URL: "${PUBLIC_WEBRTC_BASE_URL:-http://localhost:8889}"
      BACKEND_CORS_ORIGINS: "${BACKEND_CORS_ORIGINS:-http://localhost:8000}"
      BACKEND_LOG_LEVEL: "${BACKEND_LOG_LEVEL:-info}"
      BACKEND_LOG_FORMAT: "${BACKEND_LOG_FORMAT:-console}"
      # Backend Formatter 使用进程所在地区展示日志时间；不改变业务数据的 UTC 存储。
      TZ: "${TZ:-Asia/Shanghai}"
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    depends_on:
      mediamtx:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:3001/api/v1/health/live', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "${FRONTEND_API_BASE_URL:-http://localhost:3001/api/v1}"
    restart: unless-stopped
    ports:
      - "${FRONTEND_BIND_ADDRESS:-0.0.0.0}:${FRONTEND_PORT:-8000}:80"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1/ >/dev/null || exit 1
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
