version: 3.0.0
status: shadcn-aligned
baseline_ref: catalog.json#/baseline
tokens: ../tokens/layout.tokens.json

implementation:
  shell:
    - SidebarProvider
    - Sidebar
    - SidebarInset
    - SidebarTrigger
  mobile_sidebar: Sheet
  breakpoint_source: frontend/src/hooks/use-mobile.ts

layers:
  content: "{layout.layer.content}"
  header: "{layout.layer.header}"
  sidebar: "{layout.layer.sidebar}"
  overlay: "{layout.layer.overlay}"
  toast: "{layout.layer.toast}"

shell:
  provider:
    required: true
    default_open: true
    persistence: cookie
  sidebar:
    width: "{layout.shell.sidebarExpanded}"
    collapsed_width: "{layout.shell.sidebarCollapsed}"
    mobile_width: "{layout.shell.sidebarMobile}"
    side: left
    variant: sidebar
    collapsible: icon
    z_index: "{layout.layer.sidebar}"
    item_height: "{layout.control.default}"
    item_radius: "{layout.radius.menuItem}"
    collapsed_tooltip: required
  header:
    height: "{layout.shell.header}"
    position: sticky
    top: 0
    z_index: "{layout.layer.header}"
    layout: leading_center_trailing
    leading: mobile_trigger_or_back_action
    center: breadcrumb
    trailing: theme_and_page_actions
  content:
    component: SidebarInset
    min_width: 0
    page_min_width: none
    scrolling: document

page:
  inline_padding:
    desktop: "{layout.space.page}"
    compact: "{layout.space.pageCompact}"
  block_padding:
    desktop: "{layout.space.page}"
    compact: "{layout.space.pageCompact}"
  section_gap: "{layout.space.section}"

grid:
  resource_cards:
    wide:
      min_width: "{layout.breakpoint.wide}"
      columns: "repeat(4, minmax(0, 1fr))"
    medium:
      min_width: "{layout.breakpoint.cardGridSingle}"
      max_width: "calc({layout.breakpoint.wide} - 1px)"
      columns: "repeat(2, minmax(0, 1fr))"
    compact:
      max_width: "calc({layout.breakpoint.cardGridSingle} - 1px)"
      columns: "minmax(0, 1fr)"
    gap: "{layout.space.component}"
  detail_split:
    columns: "minmax(0, 1.65fr) minmax(18rem, 0.75fr)"
    collapse_below: "{layout.breakpoint.detailStack}"
    gap: "{layout.space.component}"
  form:
    columns: "repeat(2, minmax(0, 1fr))"
    collapse_below: "{layout.breakpoint.formStack}"
    gap: "{layout.space.component}"
  canvas_with_side_panel:
    columns: "minmax(0, 1fr) 14rem"
    collapse_below: "{layout.breakpoint.formStack}"

responsive:
  desktop:
    min_width: "{layout.breakpoint.sidebarSheet}"
    sidebar: expanded_or_icon
    data_list: semantic_table
  compact:
    max_width: "calc({layout.breakpoint.sidebarSheet} - 1px)"
    sidebar: Sheet
    data_list: stacked_rows_or_local_scroll
    forms: single_column
    canvas_with_side_panel: canvas_then_panel
  rules:
    - Respond to CSS viewport width; do not detect browser zoom with JavaScript.
    - Page content must not create global horizontal scrolling.
    - Wrap action groups without hiding functionality.
    - Wrap long identifiers before widening the page.

reflow:
  required:
    viewport: "{layout.breakpoint.reflowRequired}"
    requirements:
      - No global horizontal scrolling.
      - No clipped content, controls, status, or navigation.
      - Primary actions remain reachable.
  progressive:
    viewport: "{layout.breakpoint.reflowProgressive}"
    requirements:
      - Non-exempt content follows one reading direction.
      - Text and controls do not overlap.
  local_overflow:
    allowed_for: [media, interactive_canvas, semantic_data_table]
    containment: component
    page_level_overflow: prohibited

scrolling:
  sidebar_navigation: independently_scrollable
  page_content: document_scroll
  root_overflow_y: auto
  root_scrollbar_gutter: stable
