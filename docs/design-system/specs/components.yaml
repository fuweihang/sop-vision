version: 3.0.0
status: project-decisions-only

registry:
  configuration: frontend/components.json
  style: base-nova
  primitive_library: "@base-ui/react"
  icon_library: hugeicons
  source_pattern: frontend/src/components/ui/{kebab-name}.tsx

defaults:
  geometry: registry_source
  primitive_behavior: base_ui
  theme: frontend/src/index.css
  layout_tokens: ../tokens/layout.tokens.json
  rules:
    - Component keys in this file are the installed inventory.
    - Runtime source owns anatomy, CSS classes, exact state styling, and data-slot.
    - This file records only public API expectations and SOP Vision usage decisions.
    - Page className may adjust composition but must not replace primitive state logic.

components:
  alert:
    api:
      variants: [default, destructive]
    use_for: [page_feedback, recoverable_error]
    rules:
      - Include recovery guidance when an action is possible.

  alert_dialog:
    use_for: [destructive_confirmation, irreversible_action]
    rules:
      - Cancel uses outline styling.
      - Confirm uses destructive styling.
      - Do not replace with Dialog or window.confirm.

  aspect_ratio:
    use_for: [camera_preview, task_preview]
    application_ratio: "16 / 9"
    rules:
      - Loading, empty, and error states preserve the ratio.

  badge:
    api:
      variants: [default, secondary, destructive, outline, ghost, link]
    use_for: [resource_status, concise_label]
    rules:
      - Do not use for sentence-length content.

  breadcrumb:
    use_for: [header_route_context]
    rules:
      - Current page exposes aria-current.
      - Navigation has an accessible label.

  button:
    api:
      variants: [default, outline, secondary, ghost, destructive, link]
      sizes: [xs, sm, default, lg, icon-xs, icon-sm, icon, icon-lg]
    project_usage:
      default: page_primary_action
      destructive: irreversible_or_destructive_action
      link: inline_navigation_action
    rules:
      - A page has at most one visually strongest primary action.
      - Icon-only buttons require accessible names.
      - Loading preserves the button geometry.

  card:
    api:
      sizes: [default, sm]
    use_for: [resource_summary, information_section]
    rules:
      - Header actions use CardAction.
      - Do not add elevation unless the Card becomes a floating surface.

  checkbox:
    use_for: [independent_multi_selection, boolean_form_value]
    rules:
      - Use a visible label.
      - Do not recreate checked state in page code.

  dialog:
    use_for: [create_form, edit_form]
    rules:
      - Title is required.
      - Complex forms may extend Content width while preserving viewport margins.
      - Focus and dismissal remain Base UI managed.

  empty:
    use_for: [no_resources, no_filter_matches, unavailable_state]
    rules:
      - State what is absent and the next useful action.
      - Do not show an action the user cannot perform.

  field:
    api:
      orientations: [vertical, horizontal, responsive]
    use_for: [form_structure, validation]
    rules:
      - Compose Label, Description, Error, and Control.
      - Validation messages use FieldError.

  input:
    use_for: [text_value, number_value, search]
    rules:
      - Use a visible label unless the surrounding pattern provides an equivalent name.
      - Use native type and autocomplete where applicable.

  label:
    use_for: [form_control_name]
    rules:
      - Placeholder never replaces Label.

  radio_group:
    use_for: [single_selection_with_visible_options]
    rules:
      - Arrow-key and checked behavior remain Base UI managed.

  scroll_area:
    use_for: [bounded_dialog_body, bounded_sidebar_region, local_table_region]
    rules:
      - Do not use ScrollArea to hide page-level Reflow failures.

  select:
    use_for: [single_selection_with_collapsed_options]
    rules:
      - Do not substitute the prototype native select.
      - Keyboard navigation, typeahead, and portal remain Base UI managed.

  separator:
    api:
      orientations: [horizontal, vertical]
    use_for: [visual_group_boundary]
    rules:
      - Decorative is the default; expose semantics only when meaningful.

  sheet:
    api:
      sides: [top, right, bottom, left]
    use_for: [mobile_sidebar, edge_panel]
    rules:
      - Mobile navigation uses the Sidebar-integrated Sheet.

  sidebar:
    api:
      sides: [left, right]
      variants: [sidebar, floating, inset]
      collapsible: [offcanvas, icon, none]
    application:
      side: left
      variant: sidebar
      collapsible: icon
      mobile_breakpoint: "{layout.breakpoint.sidebarSheet}"
      persistence: cookie
    rules:
      - SidebarProvider owns open state.
      - Active routes use isActive/data-active.
      - Collapsed labels use Tooltip.

  skeleton:
    use_for: [initial_content_loading]
    rules:
      - Match final content geometry.
      - Avoid aggressive flashing.

  sonner:
    provider: one_toaster_at_application_root
    use_for: [async_success, async_failure, background_operation]
    rules:
      - Persistent form errors still appear near their fields.

  spinner:
    use_for: [inline_loading, button_loading]
    rules:
      - Add visible or screen-reader copy when context is ambiguous.

  switch:
    api:
      sizes: [default, sm]
    use_for: [immediate_boolean_setting]
    rules:
      - Do not implement a custom button with role=switch.
      - State remains Base UI managed.

  table:
    use_for: [task_list, structured_records]
    responsive: layout.responsive
    rules:
      - Preserve semantic table markup when rendered as a table.
      - Status uses Badge, not saturated row backgrounds.
      - Compact alternatives preserve field names.

  textarea:
    use_for: [multiline_text]
    rules:
      - Use FieldDescription for length or format guidance.

  tooltip:
    provider: TooltipProvider
    use_for: [icon_button_label, collapsed_sidebar_label]
    rules:
      - Do not place required interactive content inside Tooltip.
