version: 1.3.0
status: normalized-from-observation
defaults:
  typography:
    font_family: "{semantic.typography.body.fontFamily}"
    font_size: "{semantic.typography.body.fontSize}"
    font_weight: "{semantic.typography.body.fontWeight}"
    line_height: "{semantic.typography.body.lineHeight}"
  control_height: "{semantic.size.controlMedium}"
  control_radius: "{semantic.radius.control}"
  icon_size: "{semantic.size.icon}"
  transition:
    duration: "{semantic.motion.controlDuration}"
    easing: "{semantic.motion.standardEasing}"

components:
  button:
    anatomy: [container, leading_icon, label, trailing_icon, spinner]
    sizes:
      small:
        height: "{semantic.size.controlSmall}"
        padding_inline: 6px
        icon: "{size.icon.small}"
      medium:
        height: "{semantic.size.controlMedium}"
        padding_inline: 10px
        icon: "{size.icon.medium}"
      large:
        height: "{semantic.size.controlLarge}"
        padding_inline: 12px
        icon: "{size.icon.medium}"
    variants:
      primary:
        background: "{semantic.color.action.primaryBackground}"
        foreground: "{semantic.color.action.primaryForeground}"
        border: "{semantic.color.action.primaryBorder}"
        hover_background: "{semantic.color.action.primaryBackgroundHover}"
        hover_foreground: "{semantic.color.action.primaryForeground}"
      secondary:
        background: "{semantic.color.background.surface}"
        foreground: "{semantic.color.text.primary}"
        shadow: "{semantic.shadow.surface}"
      ghost:
        background: transparent
        foreground: "{semantic.color.text.primary}"
        hover_background: "{semantic.color.background.active}"
      danger:
        foreground: "{semantic.color.status.danger}"
        background: "{semantic.color.background.surface}"
        border: "{semantic.color.status.danger}"
    states:
      active:
        shadow: "{semantic.shadow.controlFocus}"
      focus_visible:
        shadow: "{semantic.shadow.keyboardFocus}"
      disabled:
        foreground: "{semantic.color.text.muted}"
        background: "{semantic.color.background.subtle}"
        shadow: "{semantic.shadow.surface}"
        cursor: not-allowed
      loading:
        preserve_width: true
        announce_busy: true
    accessibility:
      icon_only_requires_accessible_name: true
      minimum_hit_area: 32px
    rules:
      - Primary uses a transparent background, themed brand foreground, and a one-pixel semantic border; it must not use a solid brand fill.
      - Primary hover may add only a subtle themed tint and must preserve the foreground color.
      - Keep the shared control radius for command buttons; pill radius is reserved for badges and chip-like controls.

  text_input:
    anatomy: [container, prefix, input, suffix, validation_message]
    height: "{semantic.size.controlMedium}"
    padding_inline: 12px
    radius: "{semantic.radius.control}"
    background: "{semantic.color.background.surface}"
    foreground: "{semantic.color.text.primary}"
    placeholder: "{semantic.color.text.muted}"
    default_shadow: "{semantic.shadow.surface}"
    states:
      focus:
        shadow: "{semantic.shadow.controlFocus}"
      focus_visible:
        shadow: "{semantic.shadow.keyboardFocus}"
      disabled:
        background: "{semantic.color.background.subtle}"
        foreground: "{semantic.color.text.muted}"
        shadow: "{semantic.shadow.surface}"
        opacity: 1
        cursor: not-allowed
      invalid:
        status: danger
        describe_error_with: aria-describedby
    accessibility:
      visible_label_preferred: true
      autocomplete_required_when_applicable: true

  select:
    anatomy: [container, value, chevron, menu]
    height: "{semantic.size.controlMedium}"
    padding_inline_start: 12px
    padding_inline_end: 36px
    radius: "{semantic.radius.control}"
    background: "{semantic.color.background.surface}"
    default_shadow: "{semantic.shadow.surface}"
    states:
      disabled:
        background: "{semantic.color.background.subtle}"
        foreground: "{semantic.color.text.muted}"
        shadow: "{semantic.shadow.surface}"
        opacity: 1
        cursor: not-allowed
    menu_reference: popover
    accessibility:
      keyboard_navigation: required
      current_value_announced: true

  card:
    anatomy: [header, body, footer]
    radius: "{semantic.radius.card}"
    background: "{semantic.color.background.surface}"
    shadow: "{semantic.shadow.surface}"
    body_padding: 20px
    footer:
      min_height: 56px
      padding: 12px 12px 12px 20px
      background: "{semantic.color.background.subtle}"
      border_block_start: "1px solid {semantic.color.border.default}"
    rules:
      - Use the footer for help text and trailing actions.
      - Do not add elevation unless the card becomes a floating surface.
      - Card titles use semantic.typography.heading only on settings cards.

  sidebar_navigation:
    width: "{semantic.size.sidebar}"
    collapsed_width: "{semantic.size.sidebarCollapsed}"
    row_height: "{semantic.size.controlMedium}"
    item_radius: "{semantic.radius.control}"
    item_padding_inline: 10px
    icon_size: "{semantic.size.icon}"
    states:
      hover_background: "{semantic.color.background.subtle}"
      active_background: "{semantic.color.background.active}"
      focus_visible_shadow: "{semantic.shadow.keyboardFocus}"
    behavior:
      desktop_state: [expanded, collapsed]
      desktop_collapsible: icon
      compact_state: [closed, open]
      desktop_and_compact_state_independent: true
      keyboard_shortcut: "Control/Command + B"
      prototype_persistence: localStorage
      state_attributes: [data-state, data-collapsible]
    rules:
      - Group related destinations with a one-pixel separator.
      - Keep labels concise and avoid more than two hierarchy levels.
      - The active item requires more than an icon-color change.
      - A closed drawer is inert and removed from the accessibility tree until opened.
      - The desktop collapse control sits at the trailing edge of the sidebar header.
      - The collapsed icon rail preserves navigation icons, tooltips, and the expand control; labels, counters, and the expanded brand lockup are hidden.
      - Compact Drawer mode does not expose the desktop collapse control.

  badge:
    height: 20px
    padding_inline: 8px
    radius: "{semantic.radius.badge}"
    font_size: "{font.size.label}"
    font_weight: "{font.weight.medium}"
    letter_spacing: "{font.letterSpacing.badge}"
    icon_size: "{size.icon.small}"
    variants:
      neutral:
        foreground: "{semantic.color.text.secondary}"
      info:
        foreground: "{semantic.color.badge.foreground.info}"
      success:
        foreground: "{semantic.color.badge.foreground.success}"
      warning:
        foreground: "{semantic.color.badge.foreground.warning}"
      danger:
        foreground: "{semantic.color.badge.foreground.danger}"
    rules:
      - Use for concise status or plan labels, not full sentences.
      - Preserve readable text contrast in every theme.

  popover:
    anatomy: [surface, optional_header, content, optional_footer]
    min_width: 240px
    observed_date_picker_width: 280px
    radius: "{semantic.radius.popover}"
    padding: 12px
    background: "{semantic.color.background.surface}"
    shadow: "{semantic.shadow.popover}"
    motion:
      duration: "{semantic.motion.popoverDuration}"
      easing: "{semantic.motion.swiftEasing}"
    behavior:
      close_on_escape: true
      close_on_outside_click: true
      restore_focus_to_trigger: true
      constrain_to_viewport: true

  dialog:
    anatomy: [overlay, surface, header, body, footer]
    radius: "{semantic.radius.popover}"
    background: "{semantic.color.background.surface}"
    shadow: "{semantic.shadow.modal}"
    behavior:
      autofocus_on_open: false
      trap_focus: false
      close_on_escape: true
      close_on_outside_click: true
      restore_focus_programmatically: false
      constrain_to_viewport: true
    accessibility:
      accessible_name_required: true
      aria_modal_required: true
      note: "MVP follows the project requirement to preserve the trigger's current focus and does not move focus automatically."
    responsive:
      max_width: "calc(100vw - 48px)"
      compact_max_width: "calc(100vw - 24px)"
      form_columns_below_640px: 1
      body_overflow: auto
      header_footer_remain_visible: true

  empty_state:
    anatomy: [icon, title, description, optional_action]
    content_max_width: 420px
    alignment: center
    icon_size: 32px
    title_font_weight: "{font.weight.medium}"
    description_color: "{semantic.color.text.secondary}"
    rules:
      - Explain what is absent and the next useful action.
      - Avoid illustrations when a simple system icon is sufficient.
      - Do not show a primary action if the user cannot resolve the state.

  notice:
    anatomy: [icon, content, optional_action]
    min_height: 36px
    padding: 6px 12px
    gap: 12px
    radius: "{semantic.radius.control}"
    border: "1px solid {semantic.color.border.default}"
    variants: [neutral, info, success, warning, danger]

  switch:
    anatomy: [track, thumb, label, description]
    hit_area_height: 30px
    label_gap: 12px
    states: [off, on, focus_visible, disabled]
    accessibility:
      native_checkbox_or_switch_role: required
      label_click_toggles_control: true
      state_announced: true

  filter_bar:
    anatomy: [date_range, author, environment, repository, branch, status]
    control_height: "{semantic.size.controlMedium}"
    gap: 8px
    wrapping: allowed
    rules:
      - Keep the most frequently used filter first.
      - Show selected-count badges for multi-select filters.
      - Preserve filters in URL state when technically feasible.

  roi_editor:
    status: mvp
    anatomy: [requirement_summary, action_bar, canvas, roi_list, draft_polygon, helper_text]
    canvas:
      aspect_ratio: "16 / 9"
      drawing_cursor: crosshair
      draft_stroke: dashed
      minimum_vertices: 3
    data_contract:
      definitions_source: algorithm_api
      immutable_fields: [id, label, count]
      multiple_rois: true
    behavior:
      select_roi_from_list: true
      click_to_add_point: true
      drag_existing_vertex: false
      redraw_replaces_on_finish: true
      cancel_preserves_saved_points: true
      undo_affects_draft_only: true
      lock_roi_switch_while_drawing: true
    actions: [draw, redraw, cancel, undo_point, finish]
    states: [unselected, selected, drawing, complete, disabled]
    accessibility:
      action_buttons_keyboard_accessible: true
      roi_list_keyboard_accessible: true
      point_placement_keyboard_accessible: false
      limitation: "MVP only: polygon point placement requires a pointer; keyboard geometry editing is deferred."
    responsive:
      wide_layout: canvas_with_roi_list
      below_640px: canvas_then_roi_list
      canvas_max_width: 100%
      page_level_horizontal_overflow: prohibited
