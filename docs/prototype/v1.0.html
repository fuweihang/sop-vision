<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="SOP Vision shadcn/ui-first interactive prototype"
    />
    <title>SOP Vision · 原型 v0.1</title>
    <style>
      :root {
        color-scheme: light;
        --background: oklch(1 0 0);
        --foreground: oklch(0.145 0 0);
        --card: oklch(1 0 0);
        --card-foreground: oklch(0.145 0 0);
        --popover: oklch(1 0 0);
        --popover-foreground: oklch(0.145 0 0);
        --primary: oklch(0.5 0.134 242.749);
        --primary-foreground: oklch(0.977 0.013 236.62);
        --secondary: oklch(0.967 0.001 286.375);
        --secondary-foreground: oklch(0.21 0.006 285.885);
        --muted: oklch(0.97 0 0);
        --muted-foreground: oklch(0.556 0 0);
        --accent: oklch(0.97 0 0);
        --accent-foreground: oklch(0.205 0 0);
        --destructive: oklch(0.577 0.245 27.325);
        --border: oklch(0.922 0 0);
        --input: oklch(0.922 0 0);
        --ring: oklch(0.708 0 0);
        --sidebar: oklch(0.985 0 0);
        --sidebar-foreground: oklch(0.145 0 0);
        --sidebar-primary: oklch(0.588 0.158 241.966);
        --sidebar-primary-foreground: oklch(0.977 0.013 236.62);
        --sidebar-accent: oklch(0.97 0 0);
        --sidebar-accent-foreground: oklch(0.205 0 0);
        --sidebar-border: oklch(0.922 0 0);
        --sidebar-ring: oklch(0.708 0 0);
        --status-success: oklch(0.627 0.17 149.214);
        --status-warning: oklch(0.769 0.188 70.08);
        --radius: 0.625rem;
        --radius-sm: calc(var(--radius) * 0.6);
        --radius-md: calc(var(--radius) * 0.8);
        --radius-lg: var(--radius);
        --radius-xl: calc(var(--radius) * 1.4);
        --sidebar-width: 16rem;
        --sidebar-width-icon: 3rem;
        --sidebar-width-mobile: 18rem;
        --header-height: 3.5rem;
      }

      :root.dark {
        color-scheme: dark;
        --background: oklch(0.145 0 0);
        --foreground: oklch(0.985 0 0);
        --card: oklch(0.205 0 0);
        --card-foreground: oklch(0.985 0 0);
        --popover: oklch(0.205 0 0);
        --popover-foreground: oklch(0.985 0 0);
        --primary: oklch(0.443 0.11 240.79);
        --primary-foreground: oklch(0.977 0.013 236.62);
        --secondary: oklch(0.274 0.006 286.033);
        --secondary-foreground: oklch(0.985 0 0);
        --muted: oklch(0.269 0 0);
        --muted-foreground: oklch(0.708 0 0);
        --accent: oklch(0.269 0 0);
        --accent-foreground: oklch(0.985 0 0);
        --destructive: oklch(0.704 0.191 22.216);
        --border: oklch(1 0 0 / 10%);
        --input: oklch(1 0 0 / 15%);
        --ring: oklch(0.556 0 0);
        --sidebar: oklch(0.205 0 0);
        --sidebar-foreground: oklch(0.985 0 0);
        --sidebar-primary: oklch(0.685 0.169 237.323);
        --sidebar-primary-foreground: oklch(0.293 0.066 243.157);
        --sidebar-accent: oklch(0.269 0 0);
        --sidebar-accent-foreground: oklch(0.985 0 0);
        --sidebar-border: oklch(1 0 0 / 10%);
        --sidebar-ring: oklch(0.556 0 0);
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-width: 0;
        min-height: 100%;
        overflow-y: auto;
        scrollbar-gutter: stable;
      }

      body {
        min-width: 0;
        min-height: 100%;
        margin: 0;
        background: var(--background);
        color: var(--foreground);
        font:
          400 14px/20px "Geist Variable",
          Geist,
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      button,
      input,
      select,
      textarea {
        color: inherit;
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      h1,
      h2,
      h3,
      p,
      dl,
      dd {
        margin: 0;
      }

      [hidden] {
        display: none !important;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .icon {
        width: 1rem;
        height: 1rem;
        flex: none;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .btn,
      .icon-btn {
        display: inline-flex;
        height: 2rem;
        flex: none;
        align-items: center;
        justify-content: center;
        gap: 0.375rem;
        padding: 0 0.625rem;
        border: 1px solid transparent;
        border-radius: var(--radius-lg);
        outline: none;
        background: var(--primary);
        color: var(--primary-foreground);
        font-weight: 500;
        white-space: nowrap;
        transition:
          color 150ms,
          background 150ms,
          border-color 150ms,
          box-shadow 150ms,
          transform 100ms;
      }

      .btn:hover {
        background: color-mix(in oklch, var(--primary) 80%, transparent);
      }

      .btn:active:not([aria-haspopup]) {
        transform: translateY(1px);
      }

      .btn.outline,
      .icon-btn {
        border-color: var(--border);
        background: var(--background);
        color: var(--foreground);
      }

      .btn.outline:hover,
      .icon-btn:hover {
        background: var(--muted);
      }

      .btn.secondary {
        background: var(--secondary);
        color: var(--secondary-foreground);
      }

      .btn.ghost,
      .icon-btn.ghost {
        border-color: transparent;
        background: transparent;
        color: var(--foreground);
      }

      .btn.ghost:hover,
      .icon-btn.ghost:hover {
        background: var(--muted);
      }

      .btn.destructive {
        background: color-mix(in oklch, var(--destructive) 10%, transparent);
        color: var(--destructive);
      }

      .btn.destructive:hover {
        background: color-mix(in oklch, var(--destructive) 20%, transparent);
      }

      .btn:focus-visible,
      .icon-btn:focus-visible,
      .input:focus-visible,
      .select:focus-visible,
      .textarea:focus-visible,
      .menu-btn:focus-visible,
      .card-link:focus-visible,
      .task-row:focus-visible,
      .roi-item:focus-visible {
        border-color: var(--ring);
        box-shadow: 0 0 0 3px color-mix(in oklch, var(--ring) 50%, transparent);
      }

      .btn:disabled,
      .icon-btn:disabled,
      .input:disabled,
      .select:disabled,
      .textarea:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }

      .icon-btn {
        width: 2rem;
        padding: 0;
      }

      .input,
      .select,
      .textarea {
        width: 100%;
        min-width: 0;
        border: 1px solid var(--input);
        border-radius: var(--radius-lg);
        outline: none;
        background: transparent;
        color: var(--foreground);
        transition:
          border-color 150ms,
          box-shadow 150ms;
      }

      .input,
      .select {
        height: 2rem;
        padding: 0 0.625rem;
      }

      .select {
        appearance: none;
        padding-right: 2rem;
        background-image:
          linear-gradient(45deg, transparent 50%, currentColor 50%),
          linear-gradient(135deg, currentColor 50%, transparent 50%);
        background-position:
          calc(100% - 13px) 13px,
          calc(100% - 9px) 13px;
        background-size: 4px 4px;
        background-repeat: no-repeat;
      }

      .textarea {
        min-height: 4.5rem;
        padding: 0.5rem 0.625rem;
        resize: vertical;
      }

      .input::placeholder,
      .textarea::placeholder {
        color: var(--muted-foreground);
      }

      .field {
        display: grid;
        min-width: 0;
        gap: 0.375rem;
      }

      .field-label {
        font-size: 13px;
        font-weight: 500;
      }

      .field-help {
        color: var(--muted-foreground);
        font-size: 12px;
      }

      .field-error {
        color: var(--destructive);
        font-size: 12px;
      }

      .card {
        min-width: 0;
        overflow: hidden;
        border-radius: var(--radius-xl);
        background: var(--card);
        color: var(--card-foreground);
        box-shadow: 0 0 0 1px
          color-mix(in oklch, var(--foreground) 10%, transparent);
      }

      .card-body {
        padding: 1rem;
      }

      .card-footer {
        display: flex;
        align-items: center;
        padding: 1rem;
        border-top: 1px solid var(--border);
        background: color-mix(in oklch, var(--muted) 50%, transparent);
      }

      .badge {
        display: inline-flex;
        height: 1.25rem;
        width: fit-content;
        align-items: center;
        justify-content: center;
        gap: 0.25rem;
        padding: 0 0.5rem;
        overflow: hidden;
        border: 1px solid transparent;
        border-radius: calc(var(--radius) * 2.6);
        background: var(--secondary);
        color: var(--secondary-foreground);
        font-size: 12px;
        font-weight: 500;
        white-space: nowrap;
      }

      .badge.success {
        background: color-mix(in oklch, var(--status-success) 12%, transparent);
        color: var(--status-success);
      }

      .badge.warning {
        background: color-mix(in oklch, var(--status-warning) 14%, transparent);
        color: color-mix(
          in oklch,
          var(--status-warning) 78%,
          var(--foreground)
        );
      }

      .badge.destructive {
        background: color-mix(in oklch, var(--destructive) 10%, transparent);
        color: var(--destructive);
      }

      .status-dot {
        width: 0.375rem;
        height: 0.375rem;
        border-radius: 50%;
        background: currentColor;
      }

      .app-shell {
        min-height: 100svh;
        padding-left: var(--sidebar-width);
        transition: padding-left 150ms ease;
      }

      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        z-index: 40;
        display: flex;
        width: var(--sidebar-width);
        flex-direction: column;
        overflow: hidden;
        border-right: 1px solid var(--sidebar-border);
        background: var(--sidebar);
        color: var(--sidebar-foreground);
        transition:
          width 150ms ease,
          transform 150ms ease;
      }

      .sidebar-header {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 2rem;
        align-items: center;
        gap: 0.25rem;
        padding: 0.75rem;
      }

      .brand {
        display: flex;
        min-width: 0;
        height: 2.5rem;
        align-items: center;
        gap: 0.5rem;
        padding: 0 0.375rem;
        overflow: hidden;
        border: 0;
        border-radius: var(--radius-lg);
        background: transparent;
        color: inherit;
        text-align: left;
      }

      .brand:hover {
        background: var(--sidebar-accent);
      }

      .brand img {
        width: 2.75rem;
        height: 1.25rem;
        flex: none;
        object-fit: contain;
      }

      .brand span {
        overflow: hidden;
        font-size: 13px;
        font-weight: 600;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .sidebar-content {
        min-height: 0;
        flex: 1;
        overflow-y: auto;
        padding: 0 0.5rem 0.75rem;
      }

      .menu-label {
        padding: 0.5rem 0.625rem;
        color: var(--muted-foreground);
        font-size: 12px;
      }

      .menu {
        display: grid;
        gap: 0.125rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .menu-btn {
        display: grid;
        width: 100%;
        height: 2rem;
        grid-template-columns: 1rem minmax(0, 1fr) auto;
        align-items: center;
        gap: 0.5rem;
        padding: 0 0.5rem;
        overflow: hidden;
        border: 1px solid transparent;
        border-radius: var(--radius-md);
        outline: none;
        background: transparent;
        color: inherit;
        text-align: left;
      }

      .menu-btn:hover,
      .menu-btn[aria-current="page"] {
        background: var(--sidebar-accent);
        color: var(--sidebar-accent-foreground);
      }

      .menu-btn[aria-current="page"] {
        font-weight: 500;
      }

      .menu-copy {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .menu-count {
        color: var(--muted-foreground);
        font-size: 12px;
      }

      .sidebar-footer {
        padding: 0.75rem;
        border-top: 1px solid var(--sidebar-border);
        color: var(--muted-foreground);
        font-size: 12px;
      }

      .sidebar-scrim {
        display: none;
      }

      body[data-sidebar="collapsed"] .app-shell {
        padding-left: var(--sidebar-width-icon);
      }

      body[data-sidebar="collapsed"] .sidebar {
        width: var(--sidebar-width-icon);
      }

      body[data-sidebar="collapsed"] .sidebar-header {
        grid-template-columns: 2rem;
        padding-inline: 0.5rem;
      }

      body[data-sidebar="collapsed"] .brand,
      body[data-sidebar="collapsed"] .menu-label,
      body[data-sidebar="collapsed"] .menu-copy,
      body[data-sidebar="collapsed"] .menu-count,
      body[data-sidebar="collapsed"] .sidebar-footer {
        display: none;
      }

      body[data-sidebar="collapsed"] .sidebar-content {
        padding-inline: 0.5rem;
      }

      body[data-sidebar="collapsed"] .menu-btn {
        width: 2rem;
        grid-template-columns: 1rem;
        justify-content: center;
        padding: 0;
      }

      .main {
        min-width: 0;
      }

      .header {
        position: sticky;
        top: 0;
        z-index: 30;
        display: grid;
        height: var(--header-height);
        grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
        align-items: center;
        padding: 0 1.5rem;
        border-bottom: 1px solid var(--border);
        background: color-mix(in oklch, var(--background) 94%, transparent);
        backdrop-filter: blur(10px);
      }

      .header-leading {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 0.375rem;
        justify-self: start;
      }

      .mobile-trigger {
        display: none;
      }

      .breadcrumb {
        display: flex;
        min-width: 0;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        font-weight: 500;
      }

      .breadcrumb a {
        color: var(--muted-foreground);
        text-decoration: none;
      }

      .breadcrumb a:hover {
        color: var(--foreground);
      }

      .breadcrumb-current {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 0.375rem;
        justify-self: end;
      }

      .page {
        display: grid;
        gap: 2rem;
        padding: 1.5rem;
      }

      .toolbar,
      .page-heading,
      .section-heading {
        display: flex;
        min-width: 0;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
      }

      .toolbar-search {
        position: relative;
        min-width: 0;
        flex: 1;
      }

      .toolbar-search .icon {
        position: absolute;
        top: 0.5rem;
        left: 0.625rem;
        color: var(--muted-foreground);
        pointer-events: none;
      }

      .toolbar-search .input {
        padding-left: 2.125rem;
      }

      .page-title {
        font-size: 20px;
        line-height: 26px;
        letter-spacing: -0.025rem;
      }

      .page-description,
      .section-description {
        margin-top: 0.25rem;
        color: var(--muted-foreground);
      }

      .page-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }

      .camera-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 1rem;
      }

      .card-link {
        min-width: 0;
        padding: 0;
        overflow: hidden;
        border: 0;
        outline: none;
        background: var(--card);
        color: var(--card-foreground);
        text-align: left;
      }

      .card-link:hover {
        box-shadow:
          0 0 0 1px color-mix(in oklch, var(--foreground) 16%, transparent),
          0 6px 18px -12px
            color-mix(in oklch, var(--foreground) 35%, transparent);
      }

      .camera-preview,
      .video-stage {
        position: relative;
        display: grid;
        aspect-ratio: 16 / 9;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 38%, #2d3942 0 6%, transparent 7%),
          repeating-linear-gradient(0deg, transparent 0 3px, #ffffff08 4px),
          radial-gradient(circle at center, #273038 0, #161b1f 42%, #0c0e10 82%);
        color: #fff;
      }

      .camera-preview::after,
      .video-stage::after {
        position: absolute;
        inset: auto 0 0;
        height: 46%;
        background: linear-gradient(transparent, #0000008a);
        content: "";
      }

      .preview-status,
      .preview-label,
      .frame-meta {
        position: absolute;
        z-index: 2;
        right: 0.75rem;
        bottom: 0.75rem;
        left: 0.75rem;
        display: flex;
        align-items: center;
        gap: 0.375rem;
        font-size: 12px;
      }

      .preview-status {
        top: 0.625rem;
        right: auto;
        bottom: auto;
        width: fit-content;
        padding: 0.125rem 0.375rem;
        border-radius: var(--radius-md);
        background: #0009;
      }

      .preview-label {
        right: auto;
      }

      .camera-copy {
        display: grid;
        gap: 0.25rem;
        padding: 1rem;
      }

      .camera-title-row {
        display: flex;
        min-width: 0;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
      }

      .camera-name {
        min-width: 0;
        overflow: hidden;
        font-weight: 600;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .camera-address,
      .mono {
        color: var(--muted-foreground);
        font-family: "Geist Mono", "SFMono-Regular", Menlo, monospace;
        font-size: 12px;
      }

      .camera-meta {
        display: flex;
        justify-content: space-between;
        gap: 0.75rem;
        margin-top: 0.5rem;
        color: var(--muted-foreground);
        font-size: 12px;
      }

      .empty {
        display: grid;
        max-width: 28rem;
        min-height: 22rem;
        align-content: center;
        justify-items: center;
        margin: auto;
        padding: 2rem;
        text-align: center;
      }

      .empty-icon {
        display: grid;
        width: 2.5rem;
        height: 2.5rem;
        margin-bottom: 1rem;
        border-radius: var(--radius-lg);
        background: var(--muted);
        place-items: center;
      }

      .empty p {
        margin: 0.5rem 0 1rem;
        color: var(--muted-foreground);
      }

      .overview-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.65fr) minmax(18rem, 0.75fr);
        align-items: start;
        gap: 1.5rem;
      }

      .video-stage {
        border-radius: var(--radius-xl);
        box-shadow: 0 0 0 1px #ffffff1f;
      }

      .video-stage.paused::before {
        z-index: 3;
        font-weight: 600;
        content: "预览已停止";
      }

      .video-stage.paused > :not(.paused-copy) {
        display: none;
      }

      .video-stage.paused .paused-copy {
        display: block;
      }

      .paused-copy {
        z-index: 3;
        display: none;
        text-align: center;
      }

      .paused-copy span {
        display: block;
        margin-top: 0.25rem;
        color: #ffffffa8;
        font-size: 12px;
      }

      .info-list {
        display: grid;
        margin-top: 0.75rem;
      }

      .info-row {
        display: grid;
        grid-template-columns: 5.5rem minmax(0, 1fr);
        gap: 0.75rem;
        padding: 0.75rem 0;
        border-bottom: 1px solid var(--border);
      }

      .info-row:last-child {
        border-bottom: 0;
      }

      .info-row dt {
        color: var(--muted-foreground);
      }

      .info-row dd {
        min-width: 0;
        overflow-wrap: anywhere;
      }

      .table-wrap {
        width: 100%;
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }

      th,
      td {
        height: 2.75rem;
        padding: 0.625rem 1rem;
        border-bottom: 1px solid var(--border);
        text-align: left;
        vertical-align: middle;
      }

      th {
        color: var(--muted-foreground);
        font-size: 12px;
        font-weight: 500;
      }

      tr:last-child td {
        border-bottom: 0;
      }

      .task-row {
        cursor: pointer;
        outline: none;
      }

      .task-row:hover {
        background: var(--muted);
      }

      .task-name {
        font-weight: 500;
      }

      .task-description {
        margin-top: 0.125rem;
        color: var(--muted-foreground);
        font-size: 12px;
      }

      .switch {
        position: relative;
        display: inline-flex;
        width: 2rem;
        height: 1.15rem;
        padding: 0;
        border: 1px solid transparent;
        border-radius: 999px;
        outline: none;
        background: var(--input);
        vertical-align: middle;
      }

      .switch[aria-checked="true"] {
        background: var(--primary);
      }

      .switch::after {
        width: 1rem;
        height: 1rem;
        border-radius: 50%;
        background: var(--background);
        box-shadow: 0 1px 2px #0003;
        content: "";
        transition: transform 150ms;
      }

      .switch[aria-checked="true"]::after {
        transform: translateX(calc(100% - 2px));
      }

      .switch:focus-visible {
        box-shadow: 0 0 0 3px color-mix(in oklch, var(--ring) 50%, transparent);
      }

      .task-preview {
        display: grid;
        min-width: 0;
        gap: 0.75rem;
      }

      .roi-overlay,
      .roi-editor-svg {
        position: absolute;
        inset: 0;

        transform: translateY(0.5rem);

          padding: 0;
          border: 0;
          background: #0004;
        }

        body[data-mobile-sidebar="open"] .sidebar-scrim {
          display: block;
        }

        .desktop-collapse {
          display: none;
        }

        .mobile-trigger {
          display: inline-flex;
        }

        .header {
          padding: 0 1rem;
        }

        .page {
          gap: 1.5rem;
          padding: 1rem;
        }
      }

      @media (max-width: 640px) {

          display: none;
        }

        .breadcrumb {
          max-width: 54vw;
          font-size: 12px;
        }

        .page-heading,

        .danger-card .card-body {

        .page-actions {

        .form-grid,

          return (
            '<tr class="task-row" tabindex="0" data-route="/tasks/' +
            escapeHtml(task.id) +
            '"><td data-label="任务"><div class="task-name">' +
            escapeHtml(task.name) +
            '</div><div class="task-description">' +
            escapeHtml(task.description || "未填写描述") +
            '</div></td><td data-label="摄像头源">' +
            escapeHtml(
              camera && source

            ) +
            '</td><td data-label="算法">' +
            escapeHtml(algorithm.name) +
            '</td><td data-label="状态">' +
            taskBadge(task) +
            '</td><td data-label="查看">' +
            icon("arrow") +
            "</td></tr>"
          );
        }

        function renderTaskList() {
          updateShell("tasks");
          renderBreadcrumb("检测任务", "/tasks");
          const query = taskSearch.trim().toLowerCase();
          const filtered = tasks.filter((task) => {
            const camera = getCamera(task.cameraId);
            const algorithm = getAlgorithm(task.algorithmId);
            return [task.name, task.description, camera?.name, algorithm.name]
              .filter(Boolean)
              .some((value) => value.toLowerCase().includes(query));
          });
          const content =
            tasks.length === 0
              ? '<div class="empty"><span class="empty-icon">' +
                icon("task") +
                '</span><h2>尚未创建检测任务</h2><p>创建任务并绑定一路摄像头源和一套算法。</p><button class="btn" type="button" data-open-task>' +
                icon("plus") +
                "添加检测任务</button></div>"
              : filtered.length === 0
                ? '<div class="empty"><span class="empty-icon">' +
                  icon("search") +
                  "</span><h2>没有匹配的检测任务</h2><p>请尝试其他任务名称、摄像头源或算法。</p></div>"
                : '<section class="card"><div class="table-wrap"><table class="task-table"><thead><tr><th>任务名称</th><th>摄像头源</th><th>算法</th><th>状态</th><th><span class="sr-only">查看</span></th></tr></thead><tbody>' +
                  filtered.map(taskRow).join("") +
                  "</tbody></table></div></section>";
          outlet.innerHTML =
            '<section class="page"><div class="toolbar"><label class="toolbar-search">' +
            icon("search") +
            '<span class="sr-only">搜索检测任务</span><input class="input" type="search" value="' +
            escapeHtml(taskSearch) +
            '" placeholder="搜索任务名称、描述、摄像头源或算法" data-task-search /></label><button class="btn" type="button" data-open-task>' +
            icon("plus") +
            "添加检测任务</button></div>" +
            content +
            "</section>";
          const search = $("[data-task-search]", outlet);
          if (search) {
            search.addEventListener("input", (event) => {
              taskSearch = event.target.value;
              renderTaskList();
              const next = $("[data-task-search]", outlet);
              next.focus();
              next.setSelectionRange(taskSearch.length, taskSearch.length);
            });
          }
        }

        function roiSvg(rois, show = true) {
          if (!show) return "";
          return rois
            .filter((roi) => roi.points.length >= 3)
            .map(
              (roi) =>
                '<polygon points="' +
                roi.points.map((point) => point.join(",")).join(" ") +
                '" fill="' +
                roi.color +
                '" fill-opacity=".14" stroke="' +
                roi.color +
                '" stroke-width=".55" vector-effect="non-scaling-stroke"></polygon>',
            )
            .join("");
        }

        function parameterSummary(task) {
          const algorithm = getAlgorithm(task.algorithmId);
          return algorithm.parameters
            .map((parameter) => {
              const value = task.parameters[parameter.key];
              const label =
                parameter.type === "boolean"
                  ? value
                    ? "开启"
                    : "关闭"
                  : parameter.options?.find((item) => item.value === value)
                      ?.label || String(value) + (parameter.unit || "");
              return parameter.label + "：" + label;
            })
            .join("\n");
        }

        function renderNotFound() {
          updateShell("");
          renderBreadcrumb("页面不存在", "/cameras");
          outlet.innerHTML =
            '<section class="page"><div class="empty">' +
            icon("search") +
            '<h1>页面不存在</h1><p>当前地址没有对应的原型页面。</p><button class="btn" type="button" data-route="/cameras">返回 Cameras</button></div></section>';
        }

        function renderRoute() {
          const path = currentPath().replace(/\/+$/, "") || "/";
          if (path === "/" || path === "/cameras") {
            renderCameraList();
            return;
          }
          if (path.startsWith("/cameras/")) {
            const camera = getCamera(decodeURIComponent(path.split("/")[2]));
            if (camera) renderCameraDetail(camera);
            else renderNotFound();
            return;
          }
          if (path === "/tasks") {
            renderTaskList();
            return;
          }
          if (path.startsWith("/tasks/")) {
            const task = getTask(decodeURIComponent(path.split("/")[2]));
            if (task) renderTaskDetail(task);
            else renderNotFound();
            return;
          }
          renderNotFound();
        }

        function openDialog(name, trigger) {
          const overlay = $('[data-dialog="' + name + '"]');
          if (!overlay) return;
          dialogTrigger = trigger || document.activeElement;
          activeDialog = overlay;
          overlay.hidden = false;
          document.body.style.overflow = "hidden";
          const focusTarget = $(
            "input:not([disabled]), select:not([disabled]), textarea:not([disabled]), button:not([disabled])",
            overlay,
          );
          requestAnimationFrame(() =>
            (focusTarget || $(".dialog-content", overlay)).focus(),
          );
        }

        function closeDialog() {
          if (!activeDialog) return;
          activeDialog.hidden = true;
          document.body.style.overflow = "";
          activeDialog = null;
          const restore = dialogTrigger;
          dialogTrigger = null;
          if (restore && restore.isConnected) restore.focus();
        }

        function showFormError(selector, message, target) {
          const error = $(selector);
          error.textContent = message;
          error.hidden = false;
          if (target) {
            target.setAttribute("aria-invalid", "true");
            target.focus();
          }
        }

        function clearFormError(selector, root) {
          const error = $(selector);
          error.hidden = true;
          error.textContent = "";
          $$('[aria-invalid="true"]', root).forEach((field) =>
            field.removeAttribute("aria-invalid"),
          );
        }

        function renderSourceEditor() {
          const root = $("[data-source-editor]");
          root.innerHTML = editingSources
            .map(
              (source, index) =>
                '<div class="source-edit-row"><input class="radio" type="radio" name="camera-default-source" value="' +
                index +
                '"' +
                (source.default ? " checked" : "") +
                ' aria-label="设为默认预览源" /><input class="input" value="' +
                escapeHtml(source.name) +
                '" placeholder="视频源名称" data-source-name="' +
                index +
                '" /><input class="input" value="' +
                escapeHtml(source.path) +
                '" placeholder="Streaming/Channels/101" data-source-path="' +
                index +
                '" /><button class="icon-btn ghost" type="button" aria-label="删除视频源" data-source-remove="' +
                index +
                '">' +
                icon("trash") +
                "</button></div>",
            )
            .join("");
          $$("[data-source-name]", root).forEach((input) => {
            input.addEventListener("input", () => {
              editingSources[Number(input.dataset.sourceName)].name =
                input.value;
              updateGeneratedUrl();
            });
          });
          $$("[data-source-path]", root).forEach((input) => {
            input.addEventListener("input", () => {
              editingSources[Number(input.dataset.sourcePath)].path =
                input.value.replace(/^\/+/, "");
              updateGeneratedUrl();
            });
          });
          $$('input[name="camera-default-source"]', root).forEach((radio) => {
            radio.addEventListener("change", () => {
              editingSources.forEach(
                (source, index) =>
                  (source.default = index === Number(radio.value)),
              );
              updateGeneratedUrl();
            });
          });
          $$("[data-source-remove]", root).forEach((button) => {
            button.addEventListener("click", () => {
              if (editingSources.length === 1) {
                showFormError(
                  "[data-camera-form-error]",
                  "至少需要保留一路视频源。",
                );
                return;
              }
              const index = Number(button.dataset.sourceRemove);
              const wasDefault = editingSources[index].default;
              editingSources.splice(index, 1);
              if (wasDefault) editingSources[0].default = true;
              renderSourceEditor();
              updateGeneratedUrl();
            });
          });
        }

        function updateGeneratedUrl() {
          const ip = $("[data-camera-ip]").value.trim();
          const port = $("[data-camera-port]").value.trim();
          const source =
            editingSources.find((item) => item.default) || editingSources[0];
          $("[data-generated-url]").textContent =
            ip && port && source?.path
              ? "脱敏预览地址：rtsp://••••@" +
                ip +
                ":" +
                port +
                "/" +
                source.path.replace(/^\/+/, "")
              : "完整填写连接信息后生成脱敏预览地址。";
        }

        function openCameraForm(id, trigger) {
          const camera = id ? getCamera(id) : null;
          editingCameraId = camera?.id || null;
          $("[data-camera-dialog-title]").textContent = camera
            ? "编辑摄像头"
            : "添加摄像头";
          $("[data-camera-name]").value = camera?.name || "";
          $("[data-camera-ip]").value = camera?.ip || "";
          $("[data-camera-port]").value = camera?.port || "554";
          $("[data-camera-user]").value = camera?.user || "";
          $("[data-camera-password]").value = "";
          editingSources = (
            camera?.sources || [
              {
                name: "通道 1 主码流",
                path: "Streaming/Channels/101",
                health: "online",
              },
            ]
          ).map((source, index) => ({
            ...source,
            default: camera ? camera.preview === index : index === 0,
          }));
          clearFormError(
            "[data-camera-form-error]",
            $('[data-dialog="camera"]'),
          );
          renderSourceEditor();
          updateGeneratedUrl();
          openDialog("camera", trigger);
        }

        function saveCamera() {
          const fields = {
            name: $("[data-camera-name]"),
            ip: $("[data-camera-ip]"),
            port: $("[data-camera-port]"),
            user: $("[data-camera-user]"),
          };
          clearFormError(
            "[data-camera-form-error]",
            $('[data-dialog="camera"]'),
          );
          for (const [label, field] of Object.entries(fields)) {
            if (!field.value.trim()) {
              showFormError(
                "[data-camera-form-error]",
                "请填写" +
                  {
                    name: "摄像头名称",
                    ip: "IP 地址",
                    port: "RTSP 端口",
                    user: "用户名",
                  }[label] +
                  "。",
                field,
              );
              return;
            }
          }
          if (
            editingSources.some(
              (source) => !source.name.trim() || !source.path.trim(),
            )
          ) {
            showFormError(
              "[data-camera-form-error]",
              "请完整填写每一路视频源名称和 URL 后缀。",
            );
            return;
          }
          const preview = Math.max(
            0,
            editingSources.findIndex((source) => source.default),
          );
          const values = {
            name: fields.name.value.trim(),
            ip: fields.ip.value.trim(),
            port: fields.port.value.trim(),
            user: fields.user.value.trim(),
            credentialConfigured: true,
            preview,
            sources: editingSources.map(({ default: _default, ...source }) => ({
              ...source,
              health: source.health || "online",
            })),
          };
          if (editingCameraId) {
            Object.assign(getCamera(editingCameraId), values);
            notify("摄像头配置已保存");
            closeDialog();
            navigate("/cameras/" + editingCameraId);
          } else {
            const id = "camera-" + Date.now();
            cameras.push({ id, ...values });
            notify("摄像头已添加");
            closeDialog();
            navigate("/cameras");
          }
        }

        function renderTaskSourceOptions(selectedIndex = 0) {
          const camera = getCamera($("[data-task-camera]").value);
          $("[data-task-source]").innerHTML = (camera?.sources || [])
            .map(
              (source, index) =>
                '<option value="' +
                index +
                '"' +
                (index === Number(selectedIndex) ? " selected" : "") +
                ">" +
                escapeHtml(source.name) +
                "</option>",
            )
            .join("");
        }

        function renderParameters(values = {}) {
          const algorithm = getAlgorithm($("[data-task-algorithm]").value);
          $("[data-parameter-grid]").innerHTML = algorithm.parameters
            .map((parameter) => {
              const value =
                values[parameter.key] === undefined
                  ? parameter.default
                  : values[parameter.key];
              if (parameter.type === "boolean") {
                return (
                  '<label class="checkbox-label" style="padding-top:1.5rem"><input class="checkbox" type="checkbox" data-parameter="' +
                  escapeHtml(parameter.key) +
                  '" data-parameter-type="boolean"' +
                  (value ? " checked" : "") +
                  " />" +
                  escapeHtml(parameter.label) +
                  "</label>"
                );
              }
              if (parameter.type === "select") {
                return (
                  '<label class="field"><span class="field-label">' +
                  escapeHtml(parameter.label) +
                  '</span><select class="select" data-parameter="' +
                  escapeHtml(parameter.key) +
                  '" data-parameter-type="select">' +
                  parameter.options
                    .map(
                      (option) =>
                        '<option value="' +
                        escapeHtml(option.value) +
                        '"' +
                        (option.value === value ? " selected" : "") +
                        ">" +
                        escapeHtml(option.label) +
                        "</option>",
                    )
                    .join("") +
                  "</select></label>"
                );
              }
              return (
                '<label class="field"><span class="field-label">' +
                escapeHtml(parameter.label) +
                (parameter.unit
                  ? "（" + escapeHtml(parameter.unit) + "）"
                  : "") +
                '</span><input class="input" type="number" value="' +
                escapeHtml(value) +
                '" min="' +
                escapeHtml(parameter.min) +
                '" max="' +
                escapeHtml(parameter.max) +
                '" step="' +
                escapeHtml(parameter.step) +
                '" data-parameter="' +
                escapeHtml(parameter.key) +
                '" data-parameter-type="number" /></label>'
              );
            })
            .join("");
        }

        function syncWorkingRois(algorithm, existing = []) {
          workingRois = algorithm.rois.map((definition, index) => {
            const saved = existing.find((roi) => roi.id === definition.id);
            return {
              ...definition,
              color: saved?.color || ROI_COLORS[index % ROI_COLORS.length],
              points: saved?.points.map((point) => [...point]) || [],
            };
          });
          selectedRoiId = workingRois[0]?.id || null;
          draftPoints = null;
          renderRoiEditor();
        }

        function renderRoiEditor() {
          const selected = workingRois.find((roi) => roi.id === selectedRoiId);
          const displayRois = workingRois.map((roi) =>
            roi.id === selectedRoiId && draftPoints
              ? { ...roi, points: draftPoints }
              : roi,
          );
          $("[data-roi-editor-svg]").innerHTML =
            roiSvg(displayRois) +
            (draftPoints
              ? draftPoints
                  .map(
                    (point) =>
                      '<circle cx="' +
                      point[0] +
                      '" cy="' +
                      point[1] +
                      '" r=".8" fill="' +
                      selected.color +
                      '" stroke="#fff" stroke-width=".3"></circle>',
                  )
                  .join("")
              : "");
          $("[data-roi-list]").innerHTML = workingRois
            .map(
              (roi) =>
                '<button class="roi-item" type="button" aria-pressed="' +
                (roi.id === selectedRoiId) +
                '" data-roi-select="' +
                escapeHtml(roi.id) +
                '"><span><span class="roi-item-title">' +
                escapeHtml(roi.label) +
                '</span><span class="roi-item-meta mono">' +
                escapeHtml(roi.id) +
                '</span></span><span class="badge">' +
                (roi.points.length >= 3
                  ? roi.points.length + " 点"
                  : "未绘制") +
                "</span></button>",
            )
            .join("");
          $$("[data-roi-select]").forEach((button) => {
            button.addEventListener("click", () => {
              if (draftPoints) return;
              selectedRoiId = button.dataset.roiSelect;
              renderRoiEditor();
            });
          });
          const complete = workingRois.filter(
            (roi) => roi.points.length >= 3,
          ).length;
          $("[data-roi-requirement]").textContent =
            "算法要求 " +
            workingRois.length +
            " 个 ROI，已完成 " +
            complete +
            " 个。";
          $("[data-roi-canvas]").classList.toggle(
            "drawing",
            Boolean(draftPoints),
          );
          $("[data-roi-hint]").textContent = draftPoints
            ? "在画面中点击添加顶点；至少需要 3 个点"
            : selected
              ? selected.points.length >= 3
                ? "已选择 " + selected.label + "，可重新绘制"
                : "已选择 " + selected.label + "，点击“绘制所选 ROI”"
              : "当前算法没有 ROI 要求";
          $("[data-roi-draw]").disabled = !selected || Boolean(draftPoints);
          $("[data-roi-undo]").hidden = !draftPoints;
          $("[data-roi-cancel]").hidden = !draftPoints;
          $("[data-roi-finish]").hidden = !draftPoints;
        }

        function openTaskForm(id, trigger) {
          const task = id ? getTask(id) : null;
          editingTaskId = task?.id || null;
          $("[data-task-dialog-title]").textContent = task
            ? "编辑检测任务"
            : "创建检测任务";
          $("[data-task-name]").value = task?.name || "";
          $("[data-task-description]").value = task?.description || "";
          $("[data-task-camera]").innerHTML = cameras
            .map(
              (camera) =>
                '<option value="' +
                escapeHtml(camera.id) +
                '"' +
                (camera.id === task?.cameraId ? " selected" : "") +
                ">" +
                escapeHtml(camera.name) +
                "</option>",
            )
            .join("");
          $("[data-task-algorithm]").innerHTML = algorithms
            .map(
              (algorithm) =>
                '<option value="' +
                escapeHtml(algorithm.id) +
                '"' +
                (algorithm.id === task?.algorithmId ? " selected" : "") +
                ">" +
                escapeHtml(algorithm.name) +
                "</option>",
            )
            .join("");
          renderTaskSourceOptions(task?.sourceIndex || 0);
          renderParameters(task?.parameters || {});
          syncWorkingRois(
            getAlgorithm($("[data-task-algorithm]").value),
            task?.rois || [],
          );
          clearFormError("[data-task-form-error]", $('[data-dialog="task"]'));
          openDialog("task", trigger);
        }

        function readParameters() {
          return Object.fromEntries(
            $$("[data-parameter]").map((field) => {
              let value = field.value;
              if (field.dataset.parameterType === "boolean")
                value = field.checked;
              if (field.dataset.parameterType === "number")
                value = Number(field.value);
              return [field.dataset.parameter, value];
            }),
          );
        }

        function saveTask() {
          const name = $("[data-task-name]");
          clearFormError("[data-task-form-error]", $('[data-dialog="task"]'));
          if (!name.value.trim()) {
            showFormError("[data-task-form-error]", "请填写任务名称。", name);
            return;
          }
          if (workingRois.some((roi) => roi.points.length < 3)) {
            showFormError(
              "[data-task-form-error]",
              "请完成算法要求的全部 ROI。",
            );
            return;
          }
          const values = {
            name: name.value.trim(),
            description: $("[data-task-description]").value.trim(),
            cameraId: $("[data-task-camera]").value,
            sourceIndex: Number($("[data-task-source]").value),
            algorithmId: $("[data-task-algorithm]").value,
            parameters: readParameters(),
            rois: workingRois.map((roi) => ({
              ...roi,
              points: roi.points.map((point) => [...point]),
            })),
          };
          if (editingTaskId) {
            Object.assign(getTask(editingTaskId), values);
            notify("检测任务配置已保存");
            closeDialog();
            navigate("/tasks/" + editingTaskId);
          } else {
            const id = "task-" + Date.now();
            tasks.push({
              id,
              enabled: false,
              showRoi: true,
              ...values,
            });
            notify("检测任务已创建，当前保持停止");
            closeDialog();
            navigate("/tasks");
          }
        }

        function openConfirm(title, description, label, action, trigger) {
          $("[data-confirm-title]").textContent = title;
          $("[data-confirm-description]").textContent = description;
          $("[data-confirm-action]").textContent = label;
          confirmAction = action;
          openDialog("confirm", trigger);
        }

        function deleteCamera(id, trigger) {
          const camera = getCamera(id);
          const dependencies = tasks.filter((task) => task.cameraId === id);
          openConfirm(
            "删除摄像头",
            dependencies.length
              ? "“" +
                  camera.name +
                  "”仍被 " +
                  dependencies.length +
                  " 个检测任务引用，请先删除或迁移这些任务。"
              : "确定删除“" + camera.name + "”吗？此操作无法撤销。",
            dependencies.length ? "知道了" : "删除摄像头",
            () => {
              if (dependencies.length) {
                closeDialog();
                return;
              }
              cameras.splice(cameras.indexOf(camera), 1);
              closeDialog();
              notify("摄像头已删除");
              navigate("/cameras");
            },
            trigger,
          );
        }

        function deleteTask(id, trigger) {
          const task = getTask(id);
          openConfirm(
            "删除检测任务",
            "确定删除“" + task.name + "”吗？此操作无法撤销。",
            "删除任务",
            () => {
              tasks.splice(tasks.indexOf(task), 1);
              closeDialog();
              notify("检测任务已删除");
              navigate("/tasks");
            },
            trigger,
          );
        }

        function notify(message) {
          const region = $("[data-toast-region]");
          region.innerHTML =
            '<div class="toast">' + escapeHtml(message) + "</div>";
          const toast = $(".toast", region);
          requestAnimationFrame(() => toast.classList.add("visible"));
          clearTimeout(toastTimer);
          toastTimer = setTimeout(() => {
            toast.classList.remove("visible");
            setTimeout(() => (region.innerHTML = ""), 160);
          }, 2400);
        }

        function closeMobileSidebar() {
          document.body.dataset.mobileSidebar = "closed";
          const trigger = $("[data-sidebar-mobile-trigger]");
          trigger.setAttribute("aria-expanded", "false");
          trigger.setAttribute("aria-label", "打开主导航");
          $(".sidebar").toggleAttribute(
            "inert",
            window.matchMedia("(max-width: 767px)").matches,
          );
        }

        function toggleMobileSidebar() {
          const open = document.body.dataset.mobileSidebar !== "open";
          document.body.dataset.mobileSidebar = open ? "open" : "closed";
          const trigger = $("[data-sidebar-mobile-trigger]");
          trigger.setAttribute("aria-expanded", String(open));
          trigger.setAttribute(
            "aria-label",
            open ? "关闭主导航" : "打开主导航",
          );
          $(".sidebar").toggleAttribute("inert", !open);
          if (open) $(".menu-btn").focus();
        }

        function toggleDesktopSidebar() {
          const collapsed = document.body.dataset.sidebar !== "collapsed";
          document.body.dataset.sidebar = collapsed ? "collapsed" : "expanded";
          const button = $("[data-sidebar-collapse]");
          button.setAttribute("aria-expanded", String(!collapsed));
          button.setAttribute(
            "aria-label",
            collapsed ? "展开侧边栏" : "折叠侧边栏",
          );
          try {
            localStorage.setItem(
              "sop-prototype-sidebar",
              document.body.dataset.sidebar,
            );
          } catch (_error) {}
        }

        function applyTheme(theme, persist = true) {
          const dark = theme === "dark";
          document.documentElement.classList.toggle("dark", dark);
          const toggle = $("[data-theme-toggle]");
          toggle.setAttribute(
            "aria-label",
            dark ? "切换为浅色主题" : "切换为深色主题",
          );
          toggle.setAttribute(
            "title",
            dark ? "切换为浅色主题" : "切换为深色主题",
          );
          if (persist) {
            try {
              localStorage.setItem(
                "sop-prototype-theme",
                dark ? "dark" : "light",
              );
            } catch (_error) {}
          }
        }

        document.addEventListener("click", (event) => {
          const route = event.target.closest("[data-route]");
          if (route) {
            event.preventDefault();
            navigate(route.dataset.route);
            return;
          }
          const openCamera = event.target.closest("[data-open-camera]");
          if (openCamera) {
            openCameraForm(null, openCamera);
            return;
          }
          const editCamera = event.target.closest("[data-edit-camera]");
          if (editCamera) {
            openCameraForm(editCamera.dataset.editCamera, editCamera);
            return;
          }
          const openTask = event.target.closest("[data-open-task]");
          if (openTask) {
            openTaskForm(null, openTask);
            return;
          }
          const editTask = event.target.closest("[data-edit-task]");
          if (editTask) {
            openTaskForm(editTask.dataset.editTask, editTask);
            return;
          }
          const deleteCameraButton = event.target.closest(
            "[data-delete-camera]",
          );
          if (deleteCameraButton) {
            deleteCamera(
              deleteCameraButton.dataset.deleteCamera,
              deleteCameraButton,
            );
            return;
          }
          const deleteTaskButton = event.target.closest("[data-delete-task]");
          if (deleteTaskButton) {
            deleteTask(deleteTaskButton.dataset.deleteTask, deleteTaskButton);
            return;
          }
          const taskToggle = event.target.closest("[data-task-toggle]");
          if (taskToggle) {
            const task = getTask(taskToggle.dataset.taskToggle);
            task.enabled = !task.enabled;
            notify(task.enabled ? "检测任务已启动" : "检测任务已停止");
            renderTaskDetail(task);
            return;
          }
          const asyncButton = event.target.closest("[data-task-async]");
          if (asyncButton) {
            const label =
              asyncButton.dataset.taskAsync === "reload" ? "重载" : "重启";
            asyncButton.disabled = true;
            asyncButton.setAttribute("aria-busy", "true");
            asyncButton.innerHTML =
              icon("spinner", "spinner") + "<span>" + label + "中</span>";
            setTimeout(() => {
              notify("任务" + label + "完成");
              const task = getTask(currentPath().split("/")[2]);
              if (task) renderTaskDetail(task);
            }, 850);
            return;
          }
          const previewToggle = event.target.closest("[data-preview-toggle]");
          if (previewToggle) {
            const stage = $("[data-camera-video]");
            const paused = stage.classList.toggle("paused");
            previewToggle.innerHTML =
              icon(paused ? "play" : "pause") +
              "<span>" +
              (paused ? "开始预览" : "停止预览") +
              "</span>";
            notify(paused ? "预览已停止" : "预览已开始");
            return;
          }
          const roiToggle = event.target.closest("[data-task-roi-toggle]");
          if (roiToggle) {
            const task = getTask(roiToggle.dataset.taskRoiToggle);
            task.showRoi = !task.showRoi;
            renderTaskDetail(task);
            return;
          }
          const taskRowElement = event.target.closest(".task-row[data-route]");
          if (taskRowElement) navigate(taskRowElement.dataset.route);
        });

        $$("[data-dialog-close]").forEach((button) =>
          button.addEventListener("click", closeDialog),
        );
        $$("[data-dialog]").forEach((overlay) =>
          overlay.addEventListener("mousedown", (event) => {
            if (event.target === overlay) closeDialog();
          }),
        );
        $("[data-camera-save]").addEventListener("click", saveCamera);
        $("[data-source-add]").addEventListener("click", () => {
          editingSources.push({
            name: "",
            path: "",
            health: "online",
            default: false,
          });
          renderSourceEditor();
        });
        $$("[data-camera-ip], [data-camera-port]").forEach((input) =>
          input.addEventListener("input", updateGeneratedUrl),
        );
        $("[data-task-camera]").addEventListener("change", () =>
          renderTaskSourceOptions(0),
        );
        $("[data-task-algorithm]").addEventListener("change", () => {
          const algorithm = getAlgorithm($("[data-task-algorithm]").value);
          renderParameters();
          syncWorkingRois(algorithm);
        });
        $("[data-task-save]").addEventListener("click", saveTask);
        $("[data-roi-draw]").addEventListener("click", () => {
          const selected = workingRois.find((roi) => roi.id === selectedRoiId);
          if (!selected) return;
          draftPoints = [];
          renderRoiEditor();
        });
        $("[data-roi-undo]").addEventListener("click", () => {
          draftPoints?.pop();
          renderRoiEditor();
        });
        $("[data-roi-cancel]").addEventListener("click", () => {
          draftPoints = null;
          renderRoiEditor();
        });
        $("[data-roi-finish]").addEventListener("click", () => {
          if (!draftPoints || draftPoints.length < 3) {
            showFormError("[data-task-form-error]", "ROI 至少需要三个顶点。");
            return;
          }
          const selected = workingRois.find((roi) => roi.id === selectedRoiId);
          selected.points = draftPoints.map((point) => [...point]);
          draftPoints = null;
          clearFormError("[data-task-form-error]", $('[data-dialog="task"]'));
          renderRoiEditor();
        });
        $("[data-roi-canvas]").addEventListener("click", (event) => {
          if (!draftPoints) return;
          const rect = event.currentTarget.getBoundingClientRect();
          draftPoints.push([
            Number(
              (((event.clientX - rect.left) / rect.width) * 100).toFixed(2),
            ),
            Number(
              (((event.clientY - rect.top) / rect.height) * 56.25).toFixed(2),
            ),
          ]);
          renderRoiEditor();
        });
        $("[data-confirm-action]").addEventListener("click", () => {
          const action = confirmAction;
          confirmAction = null;
          action?.();
        });
        $("[data-sidebar-collapse]").addEventListener(
          "click",
          toggleDesktopSidebar,
        );
        $("[data-sidebar-mobile-trigger]").addEventListener(
          "click",
          toggleMobileSidebar,
        );
        $("[data-sidebar-scrim]").addEventListener("click", closeMobileSidebar);
        $("[data-theme-toggle]").addEventListener("click", () =>
          applyTheme(
            document.documentElement.classList.contains("dark")
              ? "light"
              : "dark",
          ),
        );

        document.addEventListener("keydown", (event) => {
          if (
            event.key.toLowerCase() === "b" &&
            (event.ctrlKey || event.metaKey)
          ) {
            event.preventDefault();
            if (window.matchMedia("(max-width: 767px)").matches)
              toggleMobileSidebar();
            else toggleDesktopSidebar();
            return;
          }
          if (event.key === "Escape") {
            if (draftPoints) {
              draftPoints = null;
              renderRoiEditor();
            } else if (activeDialog) {
              closeDialog();
            } else if (document.body.dataset.mobileSidebar === "open") {
              closeMobileSidebar();
            }
            return;
          }
          if (event.key === "Enter" && event.target.matches(".task-row")) {
            navigate(event.target.dataset.route);
            return;
          }
          if (event.key === "Tab" && activeDialog) {
            const focusable = $$(
              'button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])',
              activeDialog,
            ).filter(
              (element) => !element.hidden && element.offsetParent !== null,
            );
            if (!focusable.length) return;
            const first = focusable[0];
            const last = focusable[focusable.length - 1];
            if (event.shiftKey && document.activeElement === first) {
              event.preventDefault();
              last.focus();
            } else if (!event.shiftKey && document.activeElement === last) {
              event.preventDefault();
              first.focus();
            }
          }
        });

        window.addEventListener("hashchange", renderRoute);
        window.addEventListener("resize", () => {
          if (!window.matchMedia("(max-width: 767px)").matches) {
            closeMobileSidebar();
            $(".sidebar").removeAttribute("inert");
          } else if (document.body.dataset.mobileSidebar !== "open") {
            $(".sidebar").setAttribute("inert", "");
          }
        });

        let initialTheme = "light";
        let initialSidebar = "expanded";
        try {
          initialTheme =
            localStorage.getItem("sop-prototype-theme") ||
            (window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light");
          initialSidebar =
            localStorage.getItem("sop-prototype-sidebar") || "expanded";
        } catch (_error) {}
        document.body.dataset.sidebar = initialSidebar;
        applyTheme(initialTheme, false);
        if (window.matchMedia("(max-width: 767px)").matches)
          $(".sidebar").setAttribute("inert", "");
        if (!location.hash) location.hash = "/cameras";
        else renderRoute();
      })();
    </script>
  </body>
</html>
