[project]
name = "sop-vision-backend"
version = "0.1.0"
description = "SOP Vision 的 FastAPI 后端"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "fastapi",
    "httpx",
    "psycopg[binary]>=3,<4",
    "pydantic-settings",
    "sqlalchemy>=2,<3",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "respx",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "sensitive_data: Cameras 凭据与完整 RTSP URL 的跨层泄漏专项门禁",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
