server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite 生成带内容哈希的资源，因此可以长期缓存。
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 始终重新验证应用 Shell，以便新部署及时生效。
    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # 由客户端 Router 处理 /cameras/123 等路由。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
