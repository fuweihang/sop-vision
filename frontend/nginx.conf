server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite emits content-hashed assets, so they can be cached indefinitely.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Always revalidate the application shell so new deployments are visible.
    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # Let the client-side router handle routes such as /cameras/123.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
