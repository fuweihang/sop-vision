[project]
name = "algorithm"
version = "0.1.0"
description = "SOP Vision algorithm services and reusable computer-vision components"
readme = "README.md"
authors = [
    { name = "narthil", email = "narthil.ch@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.0,<2",
    "fastapi>=0.116.0",
    "httpx>=0.28.1",
    "numpy>=2.2.6",
    "opencv-python>=4.11.0.86",
    "psycopg[binary,pool]>=3.2.0,<4",
    "pydantic>=2.11.7",
    "redis>=6.4.0,<8",
    "sqlalchemy>=2.0.0,<3",
    "ultralytics>=8.4.118",
    "uvicorn>=0.35.0",
]

[project.optional-dependencies]
viewer = [
    "jsonschema>=4.25.0,<5",
    "pyside6>=6.8,<7",
]

[project.scripts]
algorithm = "algorithm:main"
algorithm-daemon = "algorithm.daemon.__main__:main"
algorithm-viewer = "algorithm.demos.viewer.__main__:main"
detector = "algorithm.workers.detector.__main__:main"

[dependency-groups]
dev = [
    "jsonschema>=4.25.0,<5",
    "pytest>=8.4.1",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
