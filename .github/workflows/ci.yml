name: SOP Vision CI

on:
  pull_request:
  push:
  workflow_dispatch:

# CI 只读取仓库内容，不上传制品、不写 PR，也不需要任何生产环境 secret。
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: 全量测试与质量检查
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sop_vision
          POSTGRES_USER: sop_vision
          POSTGRES_PASSWORD: sop_vision
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sop_vision -d sop_vision"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # 应用库只用于配置隔离比较；集成测试会基于 TEST_DATABASE_URL 创建并最终删除独立的
    # *_test 数据库。两个 URL 放在 job 级别，确保 Backend 全量测试收集 integration 测试时可用。
    env:
      DATABASE_URL: postgresql+psycopg://sop_vision:sop_vision@127.0.0.1:5432/sop_vision
      TEST_DATABASE_URL: postgresql+psycopg://sop_vision:sop_vision@127.0.0.1:5432/sop_vision_test

    steps:
      - name: 检出仓库
        uses: actions/checkout@v6

      - name: 安装固定版本 uv
        # 固定 action commit 和项目 Dockerfile 使用的 uv 版本，避免供应链标签与本地工具漂移。
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.29"
          enable-cache: true
          cache-python: true

      - name: 安装 Python 3.12
        run: uv python install 3.12

      - name: 安装 Backend 依赖
        working-directory: backend
        run: uv sync --locked

      - name: 安装 Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: 启用 pnpm 11
        run: corepack enable

      - name: 安装 Frontend 依赖
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Backend 全量测试、Lint 与格式检查
        working-directory: backend
        run: |
          uv run pytest
          uv run ruff check .
          uv run ruff format --check .

      - name: 重新生成 Cameras OpenAPI 与 Frontend 类型并检查漂移
        run: bash scripts/check-cameras-contracts.sh

      - name: Frontend 全量测试、Lint、格式检查与生产构建
        working-directory: frontend
        run: |
          pnpm test
          pnpm lint
          pnpm format:check
          pnpm build

      # 保持最后执行，让敏感数据测试拥有独立步骤和清晰的失败提示。
      - name: Cameras 敏感数据专项测试
        run: bash scripts/check-cameras-sensitive-data.sh
